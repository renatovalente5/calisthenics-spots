name: Verificar

# Corre a bateria em cada envio. NÃO reconstrói só para ver se o HTML bate certo:
# reconstrói mesmo e falha se o resultado for diferente do que está commitado —
# senão um `data/spots.json` novo com as páginas velhas passa despercebido, e o
# site publica «798 sítios» ao lado de uma lista com 812.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guardas sobre os dados
        run: python3 _source/testar-dados.py

      - name: Reconstruir as páginas e exigir que nada mude
        run: |
          python3 _source/gerar-paginas.py
          if ! git diff --quiet; then
            echo "::error::As páginas construídas não batem certo com as commitadas."
            echo "Corre 'python3 _source/gerar-paginas.py' e faz commit do resultado."
            git diff --stat
            exit 1
          fi

      - name: Servidor local, no MESMO caminho que o GitHub Pages
        run: |
          python3 _source/servidor.py 4600 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:4600/calisthenics-spots/ >/dev/null && break
            sleep 0.5
          done

      # O WORKER DE ENSAIO. Sem ele a bateria salta o envio de ponta a ponta —
      # e esse é o caminho mais importante da aplicação. Usa a chave de ensaio
      # do Turnstile (1x0000…), que aceita qualquer ficha: um Chrome sem
      # interface é, e deve ser, tratado como suspeito pelo Turnstile a sério.
      # A base é a LOCAL do wrangler; nada disto toca em produção.
      - name: Worker de ensaio, com base de dados local
        run: |
          cd worker
          cp .dev.vars.exemplo .dev.vars
          npx --yes wrangler@4 d1 execute calisthenics-spots --local --file esquema.sql
          npx --yes wrangler@4 dev --port 8799 --local > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8799/v1/saude >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8799/v1/saude || (cat /tmp/worker.log; echo "::warning::Worker de ensaio não subiu; a bateria salta o envio.")
        env:
          CLOUDFLARE_API_TOKEN: ""

      - name: Conduzir a aplicação num Chrome a sério
        run: python3 _source/testar-app.py --porta 4600

      - name: Não pode haver ligações mortas
        run: python3 _source/testar-ligacoes.py
